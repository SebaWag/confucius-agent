version: "3.8"

services:
  # === Layer 3: Raw Facts (Redis) ===
  redis:
    image: redis:7-alpine
    container_name: confucius-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # === Layer 2: Observations (PostgreSQL) ===
  postgres:
    image: postgres:16-alpine
    container_name: confucius-postgres
    environment:
      POSTGRES_DB: confucius
      POSTGRES_USER: confucius
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confucius"]
      interval: 5s
      timeout: 3s
      retries: 3

  # === Layer 1: Mental Models (ChromaDB) ===
  chromadb:
    image: chromadb/chroma:latest
    container_name: confucius-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  # === Demo App (Streamlit) ===
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: confucius-demo
    ports:
      - "8502:8501"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DSN=postgresql://confucius:${POSTGRES_PASSWORD}@postgres:5432/confucius
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIR=/data/chroma
    volumes:
      - demo-data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  chroma-data:
  demo-data:
